<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Data & Dynamic Email System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Customer Data & Personalized Email Hub</h1>
        
        <!-- Data Entry Form -->
        <form id="customerForm" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div>
                <label class="block text-sm font-medium text-gray-700">Full Name</label>
                <input type="text" id="name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Contact No.</label>
                <input type="text" id="contact" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" id="email" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div class="md:col-span-3">
                <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-indigo-700 transition">Save & Queue Email</button>
            </div>
        </form>

        <!-- Customer Table View (Spreadsheet Alternative) -->
        <h2 class="text-xl font-semibold text-gray-800 mb-4">Customer Records</h2>
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Contact</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody id="customerTableBody" class="bg-white divide-y divide-gray-200">
                    <!-- Dynamic rows loaded via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Initialize Supabase Client
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('customerForm');
        const tableBody = document.getElementById('customerTableBody');

        async function fetchCustomers() {
            const { data, error } = await supabaseClient.from('customers').select('*').order('created_at', { ascending: false });
            if (error) {
                console.error('Error fetching data:', error);
                return;
            }
            tableBody.innerHTML = '';
            data.forEach(cust => {
                const row = `<tr>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${cust.name}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${cust.contact_no}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${cust.email}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="triggerEmail('${cust.id}')" class="text-indigo-600 hover:text-indigo-900">Send Dynamic Email</button>
                    </td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const contact_no = document.getElementById('contact').value;
            const email = document.getElementById('email').value;

            const { error } = await supabaseClient.from('customers').insert([{ name, contact_no, email }]);
            if (error) {
                alert('Error saving data: ' + error.message);
            } else {
                alert('Customer saved successfully!');
                form.reset();
                fetchCustomers();
            }
        });

        async function triggerEmail(id) {
            alert('Triggering personalized email for ID: ' + id);
            // Call Supabase Edge Function here to generate dynamic text and attachments
        }

        // Load data on page load
        fetchCustomers();
    </script>
</body>
</html>
